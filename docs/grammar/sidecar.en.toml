[productions.first_match_expr]
status = "live"
intro = "The `first_match_expr` production is part of the canonical Faber grammar: the dedicated first-match selection head `primus_quem` with its owned `ubi` predicate tail. Evaluation is total over a bounded source (every candidate predicate is evaluated; first-live selection picks the result), and the result is `T ∪ nihil` for no-match or empty source. The `ubi` tail is owned by this head and never shares the reduce/scan `fixum`/`varia` binder tail; `primus_quem` claims only the expression-head position immediately followed by `(`."

[productions.summa_expr]
status = "live"
intro = "The `summa_expr` production is the one-expression distributed sum-reduce: `summa ex <source> apud [coords]? filum <lane>? fixum|varia <binder> { <term body> }`. The term body must contain exactly one valued `redde` of a numeric scalar (`fractus`/`numerus` family) and stays pure under the fragment-compatible effect subset. The combine is **sum only** — no identity or combine clause exists, and `summa` is not the general reduce/scan head (that sketch owns its own surface). The result type is the term type, broadcast across lanes for the `filum` form. `summa` claims only the expression-head position immediately followed by `ex`; elsewhere the spelling stays an ordinary identifier (`summa(2,3)` calls, `.summa` receivers, non-head names). The optional `apud` clause reuses the `itera ex` coordinate law (arity = source rank); the `filum` form admits only inside `@ nucleum` kernels and requires the source length to be a multiple of the 32-lane width in v1."

[productions.filum_clause]
status = "live"
intro = "The `filum_clause` production is the optional distributed-lane binder of `summa_expr`: `filum <IDENTIFIER>`. Present, the expression declares a per-lane cyclic fold with exactly one group collective at kernel exit (Metal `simd_sum`, CUDA `redux.sync`, WGSL shared-memory tree); absent, the expression is the portable sequential fold. `filum` is a contextual spelling claimed only by exact match inside this production — it has no lexer keyword row and remains an ordinary identifier everywhere else."

