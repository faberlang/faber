# GSD-2 glyph/glossary registry.
#
# Each `glyph` is one source codepoint.  Multi-codepoint terminals such as
# `?.`, `![`, and `+++` claim their component codepoints here; the complete
# terminal remains named by the claiming production slot.  Findings are
# report-only reconciliation rows and do not grant a consumer glyph grammar
# authority.

[registry]
schema = 1
source = "docs/EBNF.md"
role_table = [
  "access",
  "alternate_exit",
  "annotation",
  "arithmetic",
  "assignment",
  "bitwise",
  "closure_joint",
  "comparison",
  "conditional",
  "conversion",
  "equality",
  "generic",
  "gradient",
  "increment",
  "range",
  "return_type",
  "shift",
  "string_delimiter",
  "template_hole",
  "tensor_product",
  "type_ascription",
  "type_union",
  "unary",
]

[[glyphs]]
glyph = "!"
codepoint = "U+0021"
unicode_name = "EXCLAMATION MARK"
role = "access"
claiming_slots = ["nonNullSuffix"]

[[glyphs]]
glyph = "%"
codepoint = "U+0025"
unicode_name = "PERCENT SIGN"
role = "arithmetic"
claiming_slots = ["multiplicative"]

[[glyphs]]
glyph = "+"
codepoint = "U+002B"
unicode_name = "PLUS SIGN"
role = "arithmetic"
claiming_slots = ["additive"]

[[glyphs]]
glyph = "-"
codepoint = "U+002D"
unicode_name = "HYPHEN-MINUS"
role = "arithmetic"
claiming_slots = ["additive", "enumMember", "unary"]

[[glyphs]]
glyph = "."
codepoint = "U+002E"
unicode_name = "FULL STOP"
role = "access"
claiming_slots = ["memberSuffix", "nonNullSuffix", "optionalSuffix", "qualifiedIdent", "qualifiedType"]

[[glyphs]]
glyph = "/"
codepoint = "U+002F"
unicode_name = "SOLIDUS"
role = "arithmetic"
claiming_slots = ["multiplicative"]

[[glyphs]]
glyph = ":"
codepoint = "U+003A"
unicode_name = "COLON"
role = "conditional"
claiming_slots = ["jsonMember", "legacyClausuraExpr", "ternary"]

[[glyphs]]
glyph = "<"
codepoint = "U+003C"
unicode_name = "LESS-THAN SIGN"
role = "generic"
claiming_slots = ["callTypeArgs", "genericParams", "typeArguments"]

[[glyphs]]
glyph = "="
codepoint = "U+003D"
unicode_name = "EQUALS SIGN"
role = "assignment"
claiming_slots = ["annotationField", "enumMember", "fieldDecl", "fieldInit", "importAliasField", "importNameField", "importSourceField", "importVisibilityField", "importWildcardField", "nucleumField", "typeAliasDecl"]

[[glyphs]]
glyph = ">"
codepoint = "U+003E"
unicode_name = "GREATER-THAN SIGN"
role = "generic"
claiming_slots = ["callTypeArgs", "genericParams", "typeArguments"]

[[glyphs]]
glyph = "?"
codepoint = "U+003F"
unicode_name = "QUESTION MARK"
role = "conditional"
claiming_slots = ["optionalSuffix", "ternary"]

[[glyphs]]
glyph = "@"
