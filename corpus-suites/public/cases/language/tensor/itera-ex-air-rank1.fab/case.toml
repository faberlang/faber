version = 1
id = "corpus/tensor/itera-ex-air-rank1.fab"
group = "language"
input_root = "corpus"
input = "tensor/itera-ex-air-rank1.fab"
category = "tensor"
domain = "tensors"


[expect]
check_only = true

[targets.clif-jit]
outcome = "known-fail"
phase = "run"
diagnostic_contains = "unsupported MIR lowering: path that does not resolve to a local value"
known_fail_why = "The shared MIR lowering already refuses the AIR tensor path by name before an image is created. This is a compile-time lowering gap, not the runner's run-phase lane restriction."

[targets.mir]
outcome = "known-fail"
phase = "emit"
diagnostic_contains = "@ radix lane \"air\" requires a MIR-backed target"

[targets.runner]
outcome = "known-fail"
phase = "run"
diagnostic_contains = "TARGETLANE001:lane_requires_mir_backed_target"
