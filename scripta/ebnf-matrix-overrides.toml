# Planned-support overlay for grammar/EBNF_MATRIX.md.
#
# Curated (term, target) pairs that are PLANNED (not yet lowering, but intended),
# so they render ○ instead of ✕ in the rendered matrix. The reason text is a
# note for maintainers; the renderer does not print it.
#
# When you promote a planned item to shipped (it lowers), REMOVE its entry
# here: the measured matrix then renders ✓ automatically.
#
# Format:  "term"."target" = "short reason"
# Keys must match corpus/index.toml `term` spellings and the target column names
# (rust, go, ts, faber, llvm-text, wasm-text, wasm, metal-text, wgsl-text,
#  sexp-struct, sexp, runner).
#
# Add an entry only for a stated deferral; do not guess planned items.

[planned]
# The four tensor product glyphs lower on most application-lane and systems-lane
# targets. These are the pairs that still measure 0 capable exempla and are
# planned for device-target parity.
"·"."metal-text" = "planned for device targets; measures 0 on this target"
"·"."wgsl-text" = "planned for device targets; measures 0 on this target"
"×"."go" = "planned for device targets; measures 0 on this target"
"×"."wasm-text" = "planned for device targets; measures 0 on this target"
"×"."wasm" = "planned for device targets; measures 0 on this target"
"×"."metal-text" = "planned for device targets; measures 0 on this target"
"×"."wgsl-text" = "planned for device targets; measures 0 on this target"
"⊗"."go" = "planned for device targets; measures 0 on this target"
"⊗"."llvm-text" = "planned for device targets; measures 0 on this target"
"⊗"."wasm-text" = "planned for device targets; measures 0 on this target"
"⊗"."wasm" = "planned for device targets; measures 0 on this target"
"⊗"."metal-text" = "planned for device targets; measures 0 on this target"
"⊗"."wgsl-text" = "planned for device targets; measures 0 on this target"
"⊙"."metal-text" = "planned for device targets; measures 0 on this target"
"⊙"."wgsl-text" = "planned for device targets; measures 0 on this target"
