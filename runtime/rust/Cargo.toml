[package]
name = "faber"
version = "0.1.0"
edition = "2024"
description = "Faber language runtime types for generated Rust"
license = "MIT"

# Public generated-Rust carriers at `faber/runtime/rust/`. Package name and
# lib target are both `faber`, so generated `use faber::…` and the dependency
# key stay aligned.
#
# This package is a standalone workspace root so each public target package can
# build without the private compiler workspace.
[workspace]

[lib]
name = "faber"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
regex = "1"
