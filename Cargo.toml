[workspace]
members = [
    "crates/radix-hygiene",
    "crates/handroll",
    "crates/faber-leaf",
    "crates/radix",
    "crates/radix-module",
    "crates/radix-codegen-shared",
    "crates/radix-hir-faber",
    "crates/radix-mir",
    "crates/radix-mir-lower",
    "crates/radix-mir-fmir",
    "crates/radix-mir-clif",
    "crates/radix-mir-runner",
    "crates/radix-program",
    "crates/proba",
    "crates/radix-parser",
    "crates/radix-abi",
    "crates/radix-runtime-contract",
    "crates/radix-diagnostics",
    "crates/radix-hir",
    "crates/radix-hir-fhir",
    "crates/radix-lexer",
    "crates/radix-syntax",
    "crates/radix-types",
    "crates/radix-target",
    "crates/radix-intrinsics",
    "crates/radix-semantic",
    "crates/faber",
]
resolver = "2"

# Package-selection freeze (destination-map §10.3.3): bare `cargo build` /
# `cargo check` stay compiler-cheap. The default set is the compiler crates
# including the `radix` library façade; the product (faber / exempla /
# faber-hir-rust) is never a default member and is reached only via explicit
# `-p` selection.
default-members = [
    "crates/radix-hygiene",
    "crates/handroll",
    "crates/radix",
    "crates/radix-module",
    "crates/radix-codegen-shared",
    "crates/radix-hir-faber",
    "crates/radix-mir",
    "crates/radix-mir-lower",
    "crates/radix-mir-fmir",
    "crates/radix-mir-clif",
    "crates/radix-mir-runner",
    "crates/radix-parser",
    "crates/radix-abi",
    "crates/radix-runtime-contract",
    "crates/radix-diagnostics",
    "crates/radix-hir",
    "crates/radix-hir-fhir",
    "crates/radix-lexer",
    "crates/radix-syntax",
    "crates/radix-types",
]

# Workspace-wide clippy enforcement. Every crate inherits this via
# `[lints] workspace = true` in its own Cargo.toml. Per-crate overrides
# (if any) layer on top and are kept local to that crate.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Faster debug builds for test cycles. Line-table-only debuginfo is enough
# for stack traces and basic debugging; full debuginfo (default) is expensive
# to compile and bloats artifacts. Higher codegen-units lets rustc parallelize
# the codegen phase across more threads.
[profile.dev]
debug = 1
codegen-units = 256

[profile.test]
debug = 1
codegen-units = 256

# Public export: the private code generators' feature names stay
# declared so the `cfg(feature = ...)` gates they leave behind are known.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("device", "device-runtime", "hir-cobol", "hir-fortran", "hir-go", "hir-haskell", "hir-odin", "hir-pascal", "hir-python", "hir-rust", "hir-swift", "hir-ts", "mir-amd", "mir-basic", "mir-coverage", "mir-llvm", "mir-metal", "mir-sexp", "mir-wasm", "mir-wgsl"))'] }
