[package]
name = "faber"
version = "1.4.0"
edition = "2021"
description = "Faber project and package tool"
license = "MIT"

[lib]
name = "faber_cli"
path = "src/lib.rs"

[[bin]]
name = "faber"
path = "src/main.rs"

[dependencies]
# Private compiler workspace (local org layout). Not published with this crate.
radix = { path = "../radix/crates/radix" }
radix-mir = { path = "../radix/crates/radix-mir" }
radix-mir-fmir = { path = "../radix/crates/radix-mir-fmir" }
# Differentiable-GPU campaign (S1-6): the S1-3 device-artifact emitters (Metal
# MSL + CUDA NVVM/PTX) the faber device-program constructor consumes through
# the shared radix-mir surface. Build-time only — never a runtime dependency.
radix-mir-metal = { path = "../radix/crates/radix-mir-metal" }
radix-mir-llvm = { path = "../radix/crates/radix-mir-llvm" }
# Package-store library: Faber product composition may depend on cista the same
# way it depends on radix (docs/design/product-composition-radix-cista.md).
cista = { path = "../cista" }
# Differentiable-GPU campaign (S1-5): packaged device runtime types (the
# `faber::device` surface) and the composite host. Hosts owns the native
# Metal/CUDA sessions; faber owns the host factory that calls the composite
# host's one host-construction decision.
faber = { package = "faber-runtime", path = "../faber-runtime" }
faber-host-macos-arm64 = { path = "../hosts/macos-arm64" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"

[build-dependencies]
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
hygiene-ratchet = { path = "crates/hygiene-ratchet" }
tempfile = "3"

[workspace]
members = [".", "crates/exempla", "crates/hygiene-ratchet"]
resolver = "2"

[profile.dev]
debug = 1
codegen-units = 256

[profile.test]
debug = 1
codegen-units = 256

