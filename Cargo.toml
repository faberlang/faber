[package]
name = "faber"
version = "1.4.0"
edition = "2021"
description = "Faber project and package tool"
license = "MIT"

[lib]
name = "faber_cli"
path = "src/lib.rs"

[dependencies]
# Private compiler workspace (local org layout). Not published with this crate.
radix = { path = "../radix/crates/radix" }
radix-mir-fmir = { path = "../radix/crates/radix-mir-fmir" }
# Package-store library: Faber product composition may depend on cista the same
# way it depends on radix (docs/design/product-composition-radix-cista.md).
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"

[build-dependencies]
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
hygiene-ratchet = { path = "crates/hygiene-ratchet" }
tempfile = "3"

[workspace]
members = [
    "crates/hygiene-ratchet",
]
resolver = "2"

[profile.dev]
debug = 1
codegen-units = 256

[profile.test]
debug = 1
codegen-units = 256

# Public export: the private code generators' feature names stay
# declared so the `cfg(feature = ...)` gates they leave behind are known.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("device", "device-runtime", "hir-cobol", "hir-fortran", "hir-go", "hir-haskell", "hir-odin", "hir-pascal", "hir-python", "hir-rust", "hir-swift", "hir-ts", "mir-amd", "mir-basic", "mir-coverage", "mir-llvm", "mir-metal", "mir-sexp", "mir-wasm", "mir-wgsl"))'] }
