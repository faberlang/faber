[workspace]
members = [
    "crates/radix-hygiene",
    "runtime/clif",
    "crates/handroll",
    "crates/faber-leaf",
    "crates/radix",
    "crates/radix-module",
    "crates/radix-codegen-shared",
    "crates/radix-hir-c",
    "crates/radix-hir-faber",
    "crates/radix-mir",
    "crates/radix-mir-lower",
    "crates/radix-mir-fmir",
    "crates/radix-mir-clif",
    "crates/radix-mir-runner",
    "crates/radix-program",
    "crates/proba",
    "crates/radix-parser",
    "crates/radix-abi",
    "crates/radix-runtime-contract",
    "crates/radix-diagnostics",
    "crates/radix-hir",
    "crates/radix-hir-fhir",
    "crates/radix-lexer",
    "crates/radix-syntax",
    "crates/radix-types",
    "crates/radix-target",
    "crates/radix-intrinsics",
    "crates/radix-semantic",
    "crates/faber",
]
resolver = "2"

# Package-selection freeze (destination-map §10.3.3): bare `cargo build` /
# `cargo check` stay compiler-cheap. The default set is the compiler crates
# including the `radix` library façade; the product (faber / corpus-matrix /
# faber-hir-rust) is never a default member and is reached only via explicit
# `-p` selection.
default-members = [
    "crates/radix-hygiene",
    "runtime/clif",
    "crates/handroll",
    "crates/radix",
    "crates/radix-module",
    "crates/radix-codegen-shared",
    "crates/radix-hir-faber",
    "crates/radix-mir",
    "crates/radix-mir-lower",
    "crates/radix-mir-fmir",
    "crates/radix-mir-clif",
    "crates/radix-mir-runner",
    "crates/radix-parser",
    "crates/radix-abi",
    "crates/radix-runtime-contract",
    "crates/radix-diagnostics",
    "crates/radix-hir",
    "crates/radix-hir-fhir",
    "crates/radix-lexer",
    "crates/radix-syntax",
    "crates/radix-types",
]

# Workspace-wide clippy enforcement. Every crate inherits this via
# `[lints] workspace = true` in its own Cargo.toml. Per-crate overrides
# (if any) layer on top and are kept local to that crate.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Operator ruling 2026-10-30: implicit_hasher and must_use_candidate are off workspace-wide.
implicit_hasher = "allow"
must_use_candidate = "allow"

# Faster debug builds for test cycles. Line-table-only debuginfo is enough
# for stack traces and basic debugging; full debuginfo (default) is expensive
# to compile and bloats artifacts. Higher codegen-units lets rustc parallelize
# the codegen phase across more threads.
[profile.dev]
debug = 1
codegen-units = 256

[profile.test]
debug = 1
codegen-units = 256

# The compile pipeline and the MIR runner are CPU-bound interpreters of large
# programs: at opt-level 0 the `session_dispatch` hardware tests spend their
# time building device images (`radix-mir` lane-index proofs) and running the
# sequential oracle (`radix-mir-runner`, instantiated in `radix-module`,
# `radix-program` and `faber`), 2.5-3x slower than at opt-level 1. Measured
# 2026-10-27: those 82 tests cost 186 CPU-s at opt-level 0 and 68 CPU-s at
# opt-level 1; the whole `faber_cli` executable 450 -> 255 CPU-s. Under a
# loaded machine that CPU cost is what pushed the executable past the
# stage-4b 600 s timeout. Debug assertions and overflow checks stay on.
[profile.dev.package.radix-mir]
opt-level = 1

[profile.dev.package.radix-mir-runner]
opt-level = 1

[profile.dev.package.radix-module]
opt-level = 1

[profile.dev.package.radix-program]
opt-level = 1

[profile.dev.package.faber]
opt-level = 1

# Public export: the private code generators' feature names stay
# declared so the `cfg(feature = ...)` gates they leave behind are known.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("device", "device-runtime", "hir-cobol", "hir-fortran", "hir-go", "hir-haskell", "hir-odin", "hir-pascal", "hir-python", "hir-rust", "hir-swift", "hir-ts", "mir-amd", "mir-basic", "mir-coverage", "mir-llvm", "mir-metal", "mir-sexp", "mir-wasm", "mir-wgsl"))'] }
