[package]
name = "faber"
version = "1.6.0-rc.1"
edition = "2021"
description = "Faber project and package tool"
license = "MIT"

[lib]
name = "faber_cli"
path = "src/lib.rs"

[[bin]]
name = "faber"
path = "src/main.rs"

[dependencies]
# Private compiler workspace (local org layout). Not published with this crate.
radix = { path = "../radix/crates/radix", default-features = false }
# GI3-5 (gpu-inference-gguf): the Q1-default prefill device-run driver
# constructs the prefill MIR program programmatically (tensor types via the
# shared TypeTable / IndexExpr surface — the same typed-fact construction the
# emitter fixtures use). radix-types is the leaf crate radix re-exports from.
radix-types = { path = "../radix/crates/radix-types" }
faber-hir-rust = { path = "crates/faber-hir-rust", optional = true }
radix-mir = { path = "../radix/crates/radix-mir" }
radix-mir-fmir = { path = "../radix/crates/radix-mir-fmir" }
# Differentiable-GPU campaign (S1-6): the S1-3 device-artifact emitters (Metal
# MSL + CUDA NVVM/PTX) the faber device-program constructor consumes through
# the shared radix-mir surface. Build-time only — never a runtime dependency.
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by `mir-metal`.
radix-mir-metal = { path = "../radix/crates/radix-mir-metal", optional = true }
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by `mir-llvm`.
radix-mir-llvm = { path = "../radix/crates/radix-mir-llvm", optional = true }
# Package-store library: Faber product composition may depend on cista the same
# way it depends on radix (docs/design/product-composition-radix-cista.md).
cista = { path = "../cista" }
# Differentiable-GPU campaign (S1-5): packaged device runtime types (the
# `faber::device` surface) and the composite host. Hosts owns the native
# Metal/CUDA sessions; faber owns the host factory that calls the composite
# host's one host-construction decision.
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by
# `device-runtime` (the device-runtime modules compile only under it).
faber = { package = "faber-runtime", path = "../faber-runtime", optional = true }
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by
# `host-macos-arm64` (the native Metal/CUDA host leaf).
faber-host-macos-arm64 = { path = "../hosts/macos-arm64", optional = true }
# Portable product runner (Stage 2 wasm-host-parity): the single v1
# product-host owner; Faber packaging consumes the same API later.
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by `host-wasm`.
faber-host-wasm = { path = "../hosts/wasm", optional = true }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
# Package-Wasm lane (U6-D): the package-wasm builder converts each emitted
# package-aware WAT module to wasm bytes for the product host
# (`faber-host-wasm` `run_package`). Same crate the host's WAT→binary path
# uses; no separate toolchain.
wat = "1"

[build-dependencies]
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
hygiene-ratchet = { path = "crates/hygiene-ratchet" }
tempfile = "3"

[features]
default = ["full-targets"]
full-targets = [
    "hir-rust",
    "hir-faber",
    "hir-ts",
    "hir-go",
    "hir-swift",
    "hir-fhir",
    "mir-fmir",
    "mir-sexp",
    "mir-metal",
    "mir-wgsl",
    "mir-llvm",
    "mir-wasm",
    "mir-coverage",
    "device-runtime",
    "host-macos-arm64",
    "host-wasm",
]
hir-rust = ["radix/hir-rust", "dep:faber-hir-rust"]
hir-faber = ["radix/hir-faber"]
hir-ts = ["radix/hir-ts"]
hir-go = ["radix/hir-go"]
hir-swift = ["radix/hir-swift"]
hir-fhir = ["radix/hir-fhir"]
mir-fmir = ["radix/mir-fmir"]
mir-sexp = ["radix/mir-sexp"]
mir-metal = ["radix/mir-metal", "dep:radix-mir-metal"]
mir-wgsl = ["radix/mir-wgsl"]
mir-llvm = ["radix/mir-llvm", "dep:radix-mir-llvm"]
mir-wasm = ["radix/mir-wasm"]
mir-coverage = ["radix/mir-coverage"]
# DDPP1-U2 (C2 feature isolation): the device-runtime surface (package
# `faber-runtime` + the `package/device/*` / `host_factory.rs` modules)
# compiles only under this feature. It implies the device-artifact emitters
# because the device section builder consumes them (a device runtime without
# the emitters is not a buildable configuration).
device-runtime = ["dep:faber", "mir-metal", "mir-llvm"]
# DDPP1-U2 (C2 feature isolation): physical Hosts leaves compile only under
# their host features (a small build compiles no native/wasm host session code).
host-macos-arm64 = ["dep:faber-host-macos-arm64"]
host-wasm = ["dep:faber-host-wasm"]

[workspace]
members = [".", "crates/exempla", "crates/faber-hir-rust", "crates/hygiene-ratchet"]
resolver = "2"

[profile.dev]
debug = 1
codegen-units = 256

[profile.test]
debug = 1
codegen-units = 256
