[package]
name = "radix-abi"
version = "0.84.0"
edition = "2024"
description = "Radix-owned host ABI contract table (runtime symbol names and layout spellings)"
license = "MIT OR Apache-2.0"
publish = false

# Declared here, not inherited: the faber binary embeds this crate for the
# llvm-host runtime build, and that materialized copy has no workspace root.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }


[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
