[package]
name = "radix-mir"
version = "0.84.0"
edition = "2024"
description = "Faber MIR model, validation, and systems analysis (core, no emit backends)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
radix-hir = { path = "../radix-hir" }
radix-lexer = { path = "../radix-lexer" }
radix-runtime-contract = { path = "../radix-runtime-contract" }
radix-types = { path = "../radix-types" }
serde = { version = "1", features = ["derive"] }
# DDCP3-U4 (c): the execution-descriptor identity domain is a distinct typed
# domain from artifact identity — a collision-resistant digest (never FNV).
# handroll::sha256 (U5c) — same digest values as the retired sha2 crate.
handroll = { path = "../handroll" }

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
# DDCP3-U3 (c): the partition/callsite record's serialization round-trip proof
# (the record is a compiler artifact, serialized/round-tripped — a sibling-crate
# precedent: radix-mir-fmir / radix-mir-llvm both depend on serde_json).
serde_json = "1"

[lints.clippy]
# Group first at lower priority so per-lint allows below win package-wide.
pedantic = { level = "deny", priority = -1 }
# Operator ruling 2026-10-30: implicit_hasher and must_use_candidate are off workspace-wide.
implicit_hasher = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
