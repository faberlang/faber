[package]
name = "radix-hir-fhir"
version = "0.84.0"
edition = "2024"
description = "Portable analyzed-HIR artifact (FHIR) schema, codec, and validation for Radix"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
handroll = { path = "../handroll" }
radix-hir = { path = "../radix-hir" }
radix-lexer = { path = "../radix-lexer" }
radix-syntax = { path = "../radix-syntax" }
radix-types = { path = "../radix-types" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }

[lints.clippy]
# Group first at lower priority so per-lint allows below win package-wide.
pedantic = { level = "deny", priority = -1 }
# Structural: validate.rs is a single giant referential-integrity walker with
# nested helper fns and deliberately-enumerated match arms sharing traversal.
too_many_lines = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
