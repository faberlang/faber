[package]
name = "radix-lexer"
version = "0.84.0"
edition = "2024"
description = "Lexer, spans-adjacent tokens, and interner for the Radix compiler"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
handroll = { path = "../handroll" }
radix-diagnostics = { path = "../radix-diagnostics" }
serde = { version = "1.0.228", features = ["derive"] }
unicode-ident = "1"
unicode-normalization = "0.1"
unicode-script = "0.5"

[lints]
workspace = true

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
proptest = "1.11.0"
