[package]
name = "radix-target"
version = "0.84.0"
edition = "2024"
description = "Neutral compilation-target identity: enum, spelling, feature gating"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
# Intentionally empty: target identity is a std-only contract. Consumers
# forward their own hir-*/mir-* features here so `is_available` reflects
# their build.

[features]
hir-faber = []
hir-c = []
hir-fhir = []

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
