[package]
name = "radix-runtime-contract"
version = "0.84.0"
edition = "2021"
description = "Radix-owned runtime contract (display, instans, tensor shape math)"
license = "MIT"
publish = false

[dev-dependencies]
hygiene-ratchet = { path = "../hygiene-ratchet" }

# Bundled into the faber core-support archive, which ships crate roots
# without the radix workspace root manifest. Keep lints self-contained so
# the archive stays parseable standalone (see faber core-support contract).
[lints.clippy]
pedantic = "deny"

