[package]
name = "exempla"
version = "0.1.0"
edition = "2021"
description = "Faber exempla e2e harnesses (public corpora live in sibling examples/ and norma/)"
license = "MIT"
publish = false

[dependencies]
radix = { path = "../../../radix/crates/radix", default-features = false }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.2"
wait-timeout = "0.2"

[dev-dependencies]
# Package MIR lower/compile for norma:* and multi-file package exempla.
faber = { path = "../.." }
# Module-boundary full profile: reuse the cheap-profile engine (consumer
# generation) + walk/policy classification for the emit-lane parity mode.
radix-module-boundary = { path = "../../../radix/crates/radix-module-boundary" }
# Stage 2 product-runner adapter: the portable faber-host-wasm host is the
# product evidence boundary replacing the stub host and external handle maps.
faber-host-wasm = { path = "../../../hosts/wasm" }
wat = "1"

[features]
# Per-lane radix target pass-through, mirroring `faber/Cargo.toml [features]`
# (delivery per-lane-e2e-validation decision 1). Each backend lane module is
# `#[cfg(feature = "<lane>")]`-gated in `src/exempla_e2e/mod.rs` and
# `tests/e2e_harness/mod.rs` so a feature-limited build compiles only its lane.
# `default = ["full-targets"]` keeps today's full e2e unchanged (additive,
# never reduced coverage).
default = ["full-targets"]
full-targets = [
    "hir-rust",
    "hir-go",
    "hir-ts",
    "hir-swift",
    "mir-sexp",
    "mir-metal",
    "mir-wasm",
    "mir-llvm",
    "mir-fmir",
]
hir-rust = ["radix/hir-rust"]
hir-go = ["radix/hir-go"]
hir-ts = ["radix/hir-ts"]
hir-swift = ["radix/hir-swift"]
mir-sexp = ["radix/mir-sexp"]
mir-metal = ["radix/mir-metal"]
mir-wasm = ["radix/mir-wasm"]
mir-llvm = ["radix/mir-llvm"]
mir-fmir = ["radix/mir-fmir"]
