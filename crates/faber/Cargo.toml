[package]
name = "faber"
version = "1.17.0"
edition = "2024"
description = "Faber project and package tool"
license = "MIT OR Apache-2.0"

[lib]
name = "faber_cli"
path = "src/lib.rs"

[[bin]]
name = "faber"
path = "src/main.rs"

[dependencies]
# Private compiler workspace (local org layout). Not published with this crate.
radix = { path = "../radix", default-features = false }
# M7 (code review 2026-08-12): the shared library-module naming rule
# (`library_module::library_module_dash_name`). The TS product layer derives
# emitted `.ts` file names and `.js` relative ESM paths from the same stem the
# radix-hir-ts import emitter uses, so the product map cannot drift.
radix-codegen-shared = { path = "../radix-codegen-shared" }
# The Rust package build reads the Rust target's needs (regex, runtime) from
# the HIR; pulled only by `hir-rust`.
# `faber format --width N`: the opt-in wrapping pass over emitted Faber source;
# pulled only by `hir-faber`.
radix-hir-faber = { path = "../radix-hir-faber", optional = true }
# GI3-5 (gpu-inference-gguf): the Q1-default prefill device-run driver
# constructs the prefill MIR program programmatically (tensor types via the
# shared TypeTable / IndexExpr surface — the same typed-fact construction the
# emitter fixtures use). radix-types is the leaf crate radix re-exports from.
radix-types = { path = "../radix-types" }
radix-mir = { path = "../radix-mir" }
radix-mir-fmir = { path = "../radix-mir-fmir" }
# Differentiable-GPU campaign (S1-6): the S1-3 device-artifact emitters (Metal
# MSL + CUDA NVVM/PTX) the faber device-program constructor consumes through
# the shared radix-mir surface. Build-time only — never a runtime dependency.
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by `mir-metal`.
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by `mir-llvm`.
radix-mir-runner = { path = "../radix-mir-runner", optional = true }
# gpu-reset C1-e: the in-process device seam (`package::host_factory`) opens
# radix-device-core's DeviceRegistry fail-closed. No hosts path dependency —
# the parked `host-macos-arm64` feature is retired (bucket (d)); driver
# runtimes register as they land (C1-c metal, C2 cpu).
proba = { path = "../proba", default-features = false, optional = true }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Embedded reader-locale packs: gzip via flate2 (already in the workspace lock
# through zip's deflate backend). Build-time compressor + runtime decoder.
flate2 = "1"

# `faber update`: public release lookup, verified archive download, and the
# versioned install layout. HTTP(S) rides the shared `faber-leaf` client
# (rustls TLS, already linked); the SHA-256 checksum is `handroll::sha256`.
# The updater does not shell out to curl or python3.
tar = "0.4"
semver = "1"
handroll = { path = "../handroll" }
# Shared native leaves (core-norma N2): plan-time `solum:*` classification.
faber-leaf = { path = "../faber-leaf" }
# `faber run --target clif-jit` runs the program in this process: the CLIF
# runtime is linked as an rlib and its entry points are registered with the JIT
# from an explicit table. `faber build --target clif` still links the archive.
faber-host-clif = { path = "../../runtime/clif", optional = true }

# Unix advisory locks protect shared llvm-host output and archive materialization.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
flate2 = "1"

[target.'cfg(target_os = "macos")'.dependencies]

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
tempfile = "3"

[features]
default = ["full-targets", "hir-c"]
prebuilt-llvm-runtime = []
full-targets = ["hir-faber", "hir-fhir", "mir-fmir", "mir-clif", "runner"]
hir-faber = ["radix/hir-faber", "dep:radix-hir-faber"]
hir-c = ["radix/hir-c"]
hir-fhir = ["radix/hir-fhir"]
mir-fmir = ["radix/mir-fmir"]
mir-clif = ["radix/mir-clif", "dep:faber-host-clif"]
runner = ["radix/runner", "dep:radix-mir-runner", "dep:proba", "proba/runner"]

[lints]
workspace = true
