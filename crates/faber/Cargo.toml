[package]
name = "faber"
version = "1.7.0"
edition = "2021"
description = "Faber project and package tool"
license = "MIT"

[lib]
name = "faber_cli"
path = "src/lib.rs"

[[bin]]
name = "faber"
path = "src/main.rs"

[dependencies]
# Private compiler workspace (local org layout). Not published with this crate.
radix = { path = "../radix", default-features = false }
# M7 (code review 2026-08-12): the shared library-module naming rule
# (`decl::library_module_dash_name`). The TS product layer derives emitted
# `.ts` file names and `.js` relative ESM paths from the same stem the
# radix-hir-ts import emitter uses, so the product map cannot drift.
# GI3-5 (gpu-inference-gguf): the Q1-default prefill device-run driver
# constructs the prefill MIR program programmatically (tensor types via the
# shared TypeTable / IndexExpr surface — the same typed-fact construction the
# emitter fixtures use). radix-types is the leaf crate radix re-exports from.
radix-types = { path = "../radix-types" }
radix-mir = { path = "../radix-mir" }
radix-mir-fmir = { path = "../radix-mir-fmir" }
# Differentiable-GPU campaign (S1-6): the S1-3 device-artifact emitters (Metal
# MSL + CUDA NVVM/PTX) the faber device-program constructor consumes through
# the shared radix-mir surface. Build-time only — never a runtime dependency.
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by `mir-metal`.
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by `mir-llvm`.
# The generated-Rust support package supplies only language carriers used by
# the proof receipt. Model admission and numeric comparison live in the
# private test-only oracle crate below.
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by
# `host-macos-arm64` (the native Metal/CUDA host leaf).
# Portable product runner (Stage 2 wasm-host-parity): the single v1
# product-host owner; Faber packaging consumes the same API later.
# DDPP1-U2 (C2 feature isolation): gated `optional`, pulled only by `host-wasm`.
radix-mir-runner = { path = "../radix-mir-runner", optional = true }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
handroll = { path = "../handroll" }

[dev-dependencies]
hygiene-ratchet = { path = "../hygiene-ratchet" }
tempfile = "3"

[features]
default = ["full-targets"]
full-targets = ["hir-faber", "hir-fhir", "mir-fmir", "runner"]
hir-faber = ["radix/hir-faber"]
hir-fhir = ["radix/hir-fhir"]
mir-fmir = ["radix/mir-fmir"]
runner = ["radix/runner", "dep:radix-mir-runner"]

[lints]
workspace = true
