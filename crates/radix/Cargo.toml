[package]
name = "radix"
version = "0.79.0"
edition = "2021"
description = "Recursive descent compiler for Faber → Rust/Faber"
license = "MIT"

[lints.clippy]
# Group first at lower priority so per-lint allows below win package-wide.
pedantic = { level = "deny", priority = -1 }
# (lib + tests + examples + bins).
# Structural / intentional
too_many_lines = "allow"
match_same_arms = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
# Residual pedantic judgment (API shape / noisy style)
needless_pass_by_value = "allow"
unused_self = "allow"
unnecessary_wraps = "allow"
similar_names = "allow"
struct_field_names = "allow"
self_only_used_in_recursion = "allow"
items_after_statements = "allow"
used_underscore_binding = "allow"
match_wildcard_for_single_variants = "allow"
trivially_copy_pass_by_ref = "allow"
implicit_hasher = "allow"
return_self_not_must_use = "allow"
assigning_clones = "allow"
needless_continue = "allow"
unreadable_literal = "allow"
no_effect_underscore_binding = "allow"
default_trait_access = "allow"
manual_let_else = "allow"
format_push_string = "allow"
doc_link_with_quotes = "allow"
doc_markdown = "allow"
too_many_arguments = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
used_underscore_items = "allow"
result_large_err = "allow"
semicolon_if_nothing_returned = "allow"
uninlined_format_args = "allow"
redundant_closure = "allow"
unnecessary_get_then_check = "allow"
map_unwrap_or = "allow"
option_if_let_else = "allow"
let_and_return = "allow"
manual_assert = "allow"
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"
default_constructed_unit_structs = "allow"
vec_init_then_push = "allow"

[dependencies]
radix-codegen-shared = { path = "../radix-codegen-shared" }
radix-hir-faber = { path = "../radix-hir-faber" }
radix-mir = { path = "../radix-mir" }
radix-host-abi = { path = "../radix-host-abi" }
radix-runtime-contract = { path = "../radix-runtime-contract" }
radix-parser = { path = "../radix-parser" }
radix-diagnostics = { path = "../radix-diagnostics" }
radix-lexer = { path = "../radix-lexer" }
radix-syntax = { path = "../radix-syntax" }
radix-types = { path = "../radix-types" }
radix-hir = { path = "../radix-hir" }
radix-hir-fhir = { path = "../radix-hir-fhir" }
postcard = { version = "1.1.3", features = ["alloc"] }
sha2 = "0.10"
ariadne = "0.4"
thiserror = "2"
rustc-hash = "2"
unicode-ident = "1"
unicode-normalization = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
rand = "0.8"
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
toml = "1.1.2"
wait-timeout = "0.2"
wasm-encoder = { version = "0.250", default-features = false, features = ["std"] }
wat = { version = "1.250", default-features = false }

[dev-dependencies]
hygiene-ratchet = { path = "../hygiene-ratchet" }
insta = "1"
tempfile = "3"
# Read-only decoder oracle import for the CCI-2/3/4 source fixtures
# (decoder_ops::rms_norm / rope_norm; faber-runtime product code is never
# modified — the fixtures only call the oracle). Library name is `faber`.

[features]
default = []
wasm-stub-host = ["dep:wasmtime"]

[dependencies.wasmtime]
version = "46"
optional = true
