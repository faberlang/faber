[package]
name = "radix"
version = "0.84.0"
edition = "2024"
description = "Thin complete compiler façade over radix-module and radix-program"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
radix-module = { path = "../radix-module", default-features = false }
radix-program = { path = "../radix-program", default-features = false }

[features]
default = ["full-targets"]
full-targets = ["hir-faber", "hir-fhir", "mir-fmir", "mir-clif", "runner"]
hir-faber = ["radix-module/hir-faber", "radix-program/hir-faber"]
hir-fhir = ["radix-module/hir-fhir", "radix-program/hir-fhir"]
mir-fmir = ["mir-core", "radix-module/mir-fmir", "radix-program/mir-fmir"]
mir-clif = ["mir-core", "radix-module/mir-clif", "radix-program/mir-clif"]
mir-core = ["radix-module/mir-core"]
runner = ["mir-core", "radix-module/runner", "radix-program/runner"]
hir-c = ["radix-module/hir-c", "radix-program/hir-c"]
ts-import = ["radix-module/ts-import"]
hir-lean = ["radix-module/hir-lean"]

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
