[package]
name = "radix-types"
version = "0.84.0"
edition = "2024"
description = "Semantic type model, TypeTable, and shared DefId for the Radix compiler"
license = "MIT"
publish = false

[dependencies]
handroll = { path = "../handroll" }
radix-lexer = { path = "../radix-lexer" }
radix-syntax = { path = "../radix-syntax" }
rustc-hash = "2"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
rand = "0.8"
serde_json = "1"

[lints]
workspace = true

