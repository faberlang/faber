[package]
name = "radix-mir-runner"
version = "0.84.0"
edition = "2024"
description = "In-process MIR runner for Faber scripting"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
faber-leaf = { path = "../faber-leaf" }
handroll = { path = "../handroll" }
radix-codegen-shared = { path = "../radix-codegen-shared" }
radix-hir = { path = "../radix-hir" }
radix-lexer = { path = "../radix-lexer" }
radix-mir = { path = "../radix-mir" }
radix-runtime-contract = { path = "../radix-runtime-contract" }
radix-types = { path = "../radix-types" }
regex = "1"
regex-syntax = "0.8"
# WHY: `arbitrary_precision` keeps the digit string of a JSON number so an
# integer token of any length reaches `inf` (inf-delivery-spec ruling 40, U8a).
# WHY: a Faber call re-enters the interpreter natively, so deep recursion needs
# stack that grows on demand instead of the host thread's fixed size.
stacker = "0.1"

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }

[lints.clippy]
# Group first at lower priority so per-lint allows below win package-wide.
pedantic = { level = "deny", priority = -1 }
# Operator ruling 2026-10-30: implicit_hasher and must_use_candidate are off workspace-wide.
implicit_hasher = "allow"
must_use_candidate = "allow"
