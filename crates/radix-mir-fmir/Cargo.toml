[package]
name = "radix-mir-fmir"
version = "0.84.0"
edition = "2024"
description = "Portable MIR package image (FMIR) schema, codec, and validation for Radix"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
radix-mir = { path = "../radix-mir" }
radix-types = { path = "../radix-types" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
handroll = { path = "../handroll" }
toml = "1.1.2"

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
# DDCP4-U4 shared conformance fixture: drives ONE canonical DeviceProgram
# through BOTH leaf emitters. The dev-dependency cycle (the leaves depend on
# radix-mir-fmir) is the cargo-supported test-only exception.
radix-hir = { path = "../radix-hir" }
radix-lexer = { path = "../radix-lexer" }

[lints.clippy]
# Group first at lower priority so per-lint allows below win package-wide.
pedantic = { level = "deny", priority = -1 }
# Operator ruling 2026-10-30: implicit_hasher and must_use_candidate are off workspace-wide.
implicit_hasher = "allow"
must_use_candidate = "allow"
# Structural: test fixture builders serialize large literal payloads
# (device_payload_test, distributed tests); the schema validator keeps its
# gate checks in one function.
too_many_lines = "allow"
