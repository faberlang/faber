[package]
name = "radix-mir-fmir"
version = "0.79.0"
edition = "2021"
description = "Portable MIR package image (FMIR) schema, codec, and validation for Radix"
license = "MIT"
publish = false

[dependencies]
radix-mir = { path = "../radix-mir" }
radix-types = { path = "../radix-types" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.2"

[lints.clippy]
# Group first at lower priority so per-lint allows below win package-wide.
pedantic = { level = "deny", priority = -1 }
# Structural / intentional
too_many_lines = "allow"
match_same_arms = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
# Residual pedantic judgment (mirrors the radix-mir surface)
needless_pass_by_value = "allow"
unused_self = "allow"
unnecessary_wraps = "allow"
similar_names = "allow"
struct_field_names = "allow"
self_only_used_in_recursion = "allow"
items_after_statements = "allow"
used_underscore_binding = "allow"
match_wildcard_for_single_variants = "allow"
trivially_copy_pass_by_ref = "allow"
implicit_hasher = "allow"
return_self_not_must_use = "allow"
assigning_clones = "allow"
needless_continue = "allow"
unreadable_literal = "allow"
no_effect_underscore_binding = "allow"
default_trait_access = "allow"
manual_let_else = "allow"
format_push_string = "allow"
doc_link_with_quotes = "allow"
doc_markdown = "allow"
too_many_arguments = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
used_underscore_items = "allow"
result_large_err = "allow"
semicolon_if_nothing_returned = "allow"
uninlined_format_args = "allow"
redundant_closure = "allow"
unnecessary_get_then_check = "allow"
map_unwrap_or = "allow"
option_if_let_else = "allow"
let_and_return = "allow"
manual_assert = "allow"
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"
default_constructed_unit_structs = "allow"
vec_init_then_push = "allow"
