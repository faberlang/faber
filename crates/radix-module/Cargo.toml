[package]
name = "radix-module"
version = "0.84.0"
edition = "2024"
description = "Recursive descent compiler for Faber → Rust/Faber"
license = "MIT OR Apache-2.0"

[lints.clippy]
# Group first at lower priority so per-lint allows below win package-wide.
pedantic = { level = "deny", priority = -1 }
# Operator ruling 2026-10-30: implicit_hasher and must_use_candidate are off workspace-wide.
must_use_candidate = "allow"
# (lib + tests + examples + bins).
# Structural / intentional
too_many_lines = "allow"
match_same_arms = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
struct_field_names = "allow"
# Residual pedantic judgment (API shape / noisy style)
needless_pass_by_value = "allow"
similar_names = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
items_after_statements = "allow"
used_underscore_items = "allow"
implicit_hasher = "allow"
too_many_arguments = "allow"
doc_markdown = "allow"
missing_panics_doc = "allow"

# The full-compile benchmark also times the in-process scripting path
# (`radix_module::mir::run_source`, the runner lane); a core-only build excludes it.
[dependencies]
radix-codegen-shared = { path = "../radix-codegen-shared" }
radix-target = { path = "../radix-target" }
radix-intrinsics = { path = "../radix-intrinsics" }
radix-semantic = { path = "../radix-semantic" }
# Consumerless leaves, gated out of default builds (U7, removal-delivery-spec).
# Novelty Pascal leaf: default-off, NOT in full-targets.
# Novelty Fortran leaf: default-off, NOT in full-targets.
# Novelty Odin leaf: default-off, NOT in full-targets.
# Novelty C leaf: default-off, NOT in full-targets.
radix-hir-c = { path = "../radix-hir-c", optional = true }
radix-hir-faber = { path = "../radix-hir-faber", optional = true }
radix-mir = { path = "../radix-mir", optional = true }
radix-mir-lower = { path = "../radix-mir-lower", optional = true }
radix-mir-clif = { path = "../radix-mir-clif", optional = true }
radix-abi = { path = "../radix-abi" }
radix-runtime-contract = { path = "../radix-runtime-contract" }
radix-mir-runner = { path = "../radix-mir-runner", optional = true }
radix-parser = { path = "../radix-parser" }
radix-diagnostics = { path = "../radix-diagnostics" }
radix-lexer = { path = "../radix-lexer" }
radix-syntax = { path = "../radix-syntax" }
radix-types = { path = "../radix-types" }
radix-hir = { path = "../radix-hir" }
radix-hir-fhir = { path = "../radix-hir-fhir", optional = true }
postcard = { version = "1.1.3", features = ["alloc"] }
handroll = { path = "../handroll" }
ariadne = "0.4"
unicode-ident = "1"
unicode-normalization = "0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
wait-timeout = "0.2"
# Optional: only the `test-support` feature pulls it into a non-test build.
tempfile = { version = "3", optional = true }

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
metal = "0.33"

[features]
default = ["full-targets"]
full-targets = ["hir-faber", "hir-fhir", "mir-fmir", "mir-clif", "runner"]
hir-faber = ["dep:radix-hir-faber", "radix-target/hir-faber"]
hir-fhir = ["mir-core", "dep:radix-hir-fhir", "radix-target/hir-fhir", "radix-semantic/hir-fhir"]
mir-fmir = ["mir-core"]
mir-clif = ["mir-core", "dep:radix-mir-clif", "radix-target/mir-clif"]
mir-core = ["dep:radix-mir", "dep:radix-mir-lower"]
runner = ["mir-core", "dep:radix-mir-runner"]
test-support = ["dep:tempfile"]
hir-c = ["dep:radix-hir-c", "radix-target/hir-c"]

