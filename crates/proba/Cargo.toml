[package]
name = "proba"
version = "0.1.0"
edition = "2024"
description = "Faber proba inventory and MIR-runner case execution"
license = "MIT OR Apache-2.0"

[dependencies]
# The proba runner consumes compiler analysis and MIR values but does not own
# another compiler pipeline. Keep the dependency downward and core builds
# runner-free.
radix = { path = "../radix", default-features = false }
# Stable runner issue identities used by the verdict classifier.
radix-mir-runner = { path = "../radix-mir-runner", optional = true }

[features]
default = []
runner = ["radix/runner", "dep:radix-mir-runner"]

[lints]
workspace = true

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
