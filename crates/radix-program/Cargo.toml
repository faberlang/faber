[package]
name = "radix-program"
version = "0.1.0"
edition = "2024"
description = "Compiler-owned multi-file package compilation surface"
license = "MIT OR Apache-2.0"

[dependencies]
# Private compiler workspace (local org layout). Not published with this crate.
# radix-program sits above the radix facade and composes its existing
# single-unit analysis/codegen — never a second pipeline (package-api.md §5).
# Package MIR is admitted only by the package/runner/device features below.
# Target-only lanes use radix-module directly and must not inherit the package
# runner or FMIR leaves through this dependency.
radix-module = { path = "../radix-module", default-features = false }
# S-B2: the single module-naming policy (sanitize_rust_module_ident) lives in
# the shared codegen leaf so the package module tree and the Rust backend's
# use-line segments derive from one definition.
radix-codegen-shared = { path = "../radix-codegen-shared" }
# RP2a: the compiler view of faber.toml and faber.lock parses here (toml)
# with the same serde derive surface faber's product view uses.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
# RP4: Rust package assembly (rust_target.rs) consumes the Rust HIR target
# support crate. Workspace-internal (depends only on radix), same pattern as
# faber's optional `faber-hir-rust`; pulled only under `hir-rust`.
# RP5: the moved package-MIR/FMIR subset consumes the FMIR codec and schema
# types directly (image construction/loading, route decisions, test support).
radix-mir-fmir = { path = "../radix-mir-fmir", optional = true }
# Phase D: package MIR names its MIR core, HIR→MIR lowering, runner and LLVM
# emit surfaces at their owning leaf crates instead of through
# `radix_module::mir`. Each is admitted by the same feature that admits the
# matching radix-module leaf, so target-only lanes keep their small graph.
radix-mir = { path = "../radix-mir", optional = true }
radix-mir-lower = { path = "../radix-mir-lower", optional = true }
radix-mir-runner = { path = "../radix-mir-runner", optional = true }
# RP5: the moved package-MIR linker works with the shared semantic TypeId
# surface directly (mirroring faber's own direct radix-types dependency).
radix-types = { path = "../radix-types" }
# RP5: `build_package_fhir` computes content hashes through the workspace
# handroll sha256 surface (same helper faber used before the move). Pulled
# only under `hir-fhir` like faber's own dependency posture.
handroll = { path = "../handroll", optional = true }
# RP5: the moved mir test-support summaries decode FMIR images (postcard wire
# format); faber's package test suite consumes the summaries as a dependent.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
# RP5: moved mir tests build temp package fixtures (`test_temp_dir`).
tempfile = "3"

[features]
default = ["full-targets"]
full-targets = ["hir-faber", "hir-fhir", "mir-fmir", "runner"]
package-mir = ["radix-module/mir-core", "radix-module/runner", "dep:radix-mir-fmir", "dep:radix-mir", "dep:radix-mir-lower", "dep:radix-mir-runner"]
hir-faber = ["radix-module/hir-faber"]
hir-fhir = ["radix-module/hir-fhir", "dep:handroll", "dep:radix-mir-lower"]
mir-fmir = ["package-mir", "radix-module/mir-fmir"]
runner = ["package-mir", "radix-module/runner"]

[lints]
workspace = true
