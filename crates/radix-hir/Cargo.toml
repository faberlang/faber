[package]
name = "radix-hir"
version = "0.84.0"
edition = "2024"
description = "HIR nodes and visitors for the Radix compiler"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
handroll = { path = "../handroll" }
radix-lexer = { path = "../radix-lexer" }
radix-syntax = { path = "../radix-syntax" }
radix-types = { path = "../radix-types" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }

[lints]
workspace = true


[dev-dependencies]
radix-hygiene = { path = "../radix-hygiene" }
serde_json = "1"
