[package]
name = "radix-hir"
version = "0.79.0"
edition = "2021"
description = "HIR nodes and visitors for the Radix compiler"
license = "MIT"
publish = false

[dependencies]
radix-lexer = { path = "../radix-lexer" }
radix-syntax = { path = "../radix-syntax" }
radix-types = { path = "../radix-types" }
postcard = { version = "1.1.3", features = ["alloc"] }
rustc-hash = "2"
serde = { version = "1.0.228", features = ["derive"] }

[lints]
workspace = true

