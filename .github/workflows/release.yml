name: Release Faber

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Faber source tag to release, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_REPO: faberlang/releases
  COMPONENT: faber

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: faber
          # macos-13 (Intel) removed: GitHub-hosted queue is often unbounded.
          # Ship Linux x64 + Apple silicon; re-add Intel only with a reliable runner.
          - os: macos-14
            target: aarch64-apple-darwin
            binary: faber

    steps:
      - name: Resolve source tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Faber releases require a stable SemVer source tag like v1.1.0; got $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=${COMPONENT}-${tag}" >> "$GITHUB_OUTPUT"

      # Faber's Cargo.toml has `radix = { path = "../radix/crates/radix" }` and
      # build.rs assembles core-support from sibling repos via
      # core-support-manifest.txt. The CI workspace must mirror the local
      # faberlang/ layout with all repos as siblings under one parent.

      - name: Check out Faber source
        uses: actions/checkout@v4
        with:
          path: faber
          ref: ${{ steps.source.outputs.tag }}

      # Pinned sibling checkouts: resolve the exact source commits from the
      # committed release-manifest.yaml (schema §4) instead of default-branch
      # tips, so the CI artifact matches the manifest freeze (the reference
      # pack's PACK.toml source_commit comes from the radix checkout HEAD).
      - name: Resolve pinned sibling commits
        id: pins
        shell: bash
        working-directory: faber
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          text = open("release-manifest.yaml").read()
          source_block = text.split("  source:")[1].split("  packs:")[0]
          rows = re.findall(r"- name: (\S+)\n\s+commit: ([0-9a-f]{40})", source_block)
          pins = dict(rows)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for name in ("radix", "cista", "faber-runtime", "hosts"):
                  if name not in pins:
                      raise SystemExit(
                          f"release-manifest.yaml missing pinned commit for {name}"
                      )
                  # Output keys must be safe in steps.<id>.outputs.<key>
                  # expressions: hyphenated repo names become underscores.
                  key = name.replace("-", "_")
                  print(f"{key}_sha={pins[name]}", file=fh)
          PY

      - name: Check out Radix (private)
        uses: actions/checkout@v4
        with:
          repository: faberlang/radix
          path: radix
          ref: ${{ steps.pins.outputs.radix_sha }}
          token: ${{ secrets.FABERLANG_RELEASES_TOKEN }}

      - name: Check out Cista
        uses: actions/checkout@v4
        with:
          repository: faberlang/cista
          path: cista
          ref: ${{ steps.pins.outputs.cista_sha }}

      - name: Check out Faber runtime
        uses: actions/checkout@v4
        with:
          repository: faberlang/faber-runtime
          path: faber-runtime
          ref: ${{ steps.pins.outputs.faber_runtime_sha }}

      - name: Check out hosts monorepo
        uses: actions/checkout@v4
        with:
          repository: mintedgeek/hosts
          path: hosts
          ref: ${{ steps.pins.outputs.hosts_sha }}

      - name: Validate crate version
        shell: bash
        working-directory: faber
        run: |
          set -euo pipefail
          crate_version="$(
            awk '
              /^\[package\]/ { in_package=1; next }
              /^\[/ && in_package { exit }
              in_package && /^version[[:space:]]*=/ {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          if [[ "$crate_version" != "${{ steps.source.outputs.version }}" ]]; then
            echo "tag ${{ steps.source.outputs.tag }} does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Build Faber CLI
        shell: bash
        working-directory: faber
        run: |
          set -euo pipefail
          cargo build --locked --release --bin faber --target "${{ matrix.target }}"
          "target/${{ matrix.target }}/release/${{ matrix.binary }}" --version

      - name: Package artifact
        id: package
        shell: bash
        working-directory: faber
        run: |
          set -euo pipefail
          version="${{ steps.source.outputs.version }}"
          target="${{ matrix.target }}"
          # Assemble the dev-kit payload tree (packs beside the binary) from
          # the pinned sibling checkouts. --manifest points at a scratch dir:
          # assemble-dev-kit would otherwise regenerate the committed
          # release-manifest.yaml in the checked-out tree (schema §7 freeze
          # artifact; the committed instance stays the release record).
          scratch="$(mktemp -d)"
          python3 scripta/assemble-dev-kit \
            --version "$version" \
            --triple "$target" \
            --binary "target/${target}/release/${{ matrix.binary }}" \
            --out dist \
            --manifest "$scratch"
          # Clean-room payload proof (positive + negative checks) against the
          # scratch manifest regenerated from this payload.
          python3 scripta/verify-dev-kit \
            --payload "dist/dev-kit-${version}-${target}" \
            --version "$version" \
            --manifest "$scratch/release-manifest.yaml"
          # Deterministic archive + basename-only .sha256 (release-contract.md §5.1).
          python3 scripta/package-archive \
            --staging "dist/dev-kit-${version}-${target}" \
            --component "${{ env.COMPONENT }}" \
            --version "$version" \
            --triple "$target" \
            --out dist
          archive="${COMPONENT}-v${version}-${target}.tar.gz"
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${archive}.sha256" >> "$GITHUB_OUTPUT"

      # Consumer smoke-test gate (U3): install the packaged archive into a
      # clean prefix and prove a fresh consumer can use it (pack-exercising
      # assertions first, version last, archive-layout proof). Fails fast
      # before upload — the P0 guard that a bare-binary archive (v1.5.0
      # shape) must be rejected.
      - name: Consumer smoke-test gate
        shell: bash
        working-directory: faber
        run: |
          set -euo pipefail
          version="${{ steps.source.outputs.version }}"
          target="${{ matrix.target }}"
          python3 scripta/smoke-test-release-archive \
            --archive "${{ steps.package.outputs.archive }}" \
            --version "$version" \
            --triple "$target"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPONENT }}-${{ steps.source.outputs.version }}-${{ matrix.target }}
          path: |
            faber/${{ steps.package.outputs.archive }}
            faber/${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  publish:
    name: Publish public release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve source tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=${COMPONENT}-${tag}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to shared public release repo
        env:
          GH_TOKEN: ${{ secrets.FABERLANG_RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "FABERLANG_RELEASES_TOKEN must allow writes to ${RELEASE_REPO}" >&2
            exit 1
          fi
          release_tag="${{ steps.source.outputs.release_tag }}"
          source_tag="${{ steps.source.outputs.tag }}"
          version="${{ steps.source.outputs.version }}"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Faber ${version}

          Source tag: faberlang/faber ${source_tag}

          This release contains the Faber project and package tool CLI. It is
          built from the public Faber source repository with the private Radix
          compiler and public runtime/host repos assembled as build-time
          siblings. Public artifacts are collected in ${RELEASE_REPO} with
          component-prefixed tags.
          EOF
          if gh release view "$release_tag" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "Stable release $release_tag already exists; refusing to overwrite assets" >&2
            exit 1
          fi
          gh release create "$release_tag" dist/* \
            --repo "$RELEASE_REPO" \
            --title "Faber ${version}" \
            --notes-file "$notes"
