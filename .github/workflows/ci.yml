# CI for the public Faber repository (exported from the private development
# repository; see scripta/export-public there). Builds faber, runs the
# workspace tests and the public corpus suite on the reference runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build faber
        run: cargo build --release -p faber
      - name: Workspace tests
        run: cargo test --workspace
      - name: Public corpus suite on the runner
        run: |
          set +e
          target/release/faber corpus corpus-suites/public --target runner > corpus-runner.jsonl
          code=$?
          jq -c 'select(.type=="summary" or (.type=="case" and .status!="pass")) | if .type=="summary" then . else {case,status,reason} end' corpus-runner.jsonl
          exit $code
      - name: Upload runner corpus results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-runner-${{ matrix.os }}
          path: corpus-runner.jsonl
          if-no-files-found: warn
      - name: Faber round trip
        if: always()
        run: |
          set +e
          target/release/faber corpus corpus-suites/public --target roundtrip > corpus-roundtrip.jsonl
          code=$?
          jq -c 'select(.type=="summary" or (.type=="case" and .status!="pass")) | if .type=="summary" then . else {case,status,reason} end' corpus-roundtrip.jsonl
          exit $code
      - name: Upload round trip corpus results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-roundtrip-${{ matrix.os }}
          path: corpus-roundtrip.jsonl
          if-no-files-found: warn
