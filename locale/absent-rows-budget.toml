# Absent-row budgets for the translated reader packs.
#
# The numbers in this file may only go down. A pack that translates rows lowers
# its number in the same change. The pack gate is exact: a count under budget
# fails too, so the number cannot drift upward or lag behind a translation.
#
# A row is absent when `fields_absent_from_pack` cannot find the corresponding
# `en` diagnostics text field in the pack's own `pack.toml`. Rows missing
# entirely count as message plus help where `en` has help.
#
# Gate test:
# `locale_pack_completeness_translated_packs_have_no_unbudgeted_absent_rows`
# in crates/radix-module/src/locale_test.rs.

[budget]
ar = 883
hi = 877
"th-TH" = 877
vi = 883
"zh-Hans" = 883
"zh-Hant" = 883
