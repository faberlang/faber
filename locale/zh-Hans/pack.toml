[llm]
system_prompt_snippet = "Emit Simplified Chinese reader-locale Faber using Chinese keywords for declarations, control flow, loops, returns, booleans, common primitive types, and list/map collections. Keep Faber glyph syntax unchanged."
exemplars = ["./exemplars/salve-munde.zh-Hans.fab"]

# [intrinsics] — canonical (Latin) intrinsic name -> this pack's surface spelling.
# One row per canonical in the compiler registry (INTRINSICS), in en-pack order;
# the row applies to every receiver family that owns the name. Pack-first
# resolution means a missing row makes the member unusable in this locale, so
# intrinsic_pack_completeness_test.rs fails on any missing row. Surfaces are
# NFKC-normalized. MACHINE-CHOSEN, NEEDS NATIVE REVIEW. Identity rows remain
# only for the technical names en also keeps (rms_norm, rope_norm, gelu, silu,
# formata, swizzle).
