# Identical-to-en exemptions for the `hi` reader pack — shrink-only list.
# Gate tests in crates/radix-module/src/locale_test.rs:
# `locale_pack_completeness_translated_packs_do_not_ship_english_rows_unless_exempt`
# and `locale_pack_completeness_identical_to_en_exemptions_must_stay_live`.
# Every entry in this file must have pack = "hi".
#
# Reader-pack text fields that are still byte-equal to the `en` pack.
#
# `locale_pack_completeness_translated_packs_do_not_ship_english_rows_unless_exempt`
# fails for any translated-pack diagnostics text field (message/help) whose text
# equals `en`'s text for the same code/issue/field, unless that exact
# (pack, code, issue, field) is listed here. `en` and `la` are outside the gate:
# `en` is the comparison source, and `la` is the canonical Latin pack whose issue
# rows were English before the R12 range, so its rows are deliberately not
# treated as translation debt.
#
# Rule: this list may only shrink. When a pack's text for an entry no longer
# equals `en` (the row was translated), the entry must be deleted;
# `locale_pack_completeness_identical_to_en_exemptions_must_stay_live` fails
# while a dead entry remains. A missing `issue` key means the code's base row.
#
# Reasons:
# - "language-neutral": the text has no translatable word — only glyphs,
#   tokens, placeholders, or code names.
# The hi pack's recorded translation debt was translated (need, R12);
# a translated row deletes its entry here instead of carrying a debt reason.

entry = [
    { pack = "hi", code = "SEM006", issue = "kernel_invalid_path", field = "message", reason = "language-neutral" },
]
