# Library-owned member fragment for the Latin reader surface.
# Not a reader keyword pack — only [pack] + [[library_members]].
# Canonical names stay the English source spellings in norma/src.
#
# Two identities for the same module:
#   provider = "norma"                      — radix check (`norma:text`)
#   provider = "package", package = "norma" — faber FileInterface
#
# The la pack is an identity pack, so members install as-written; these rows
# add the Latin surface projections for members whose canonical names became
# English in Pass B.

[pack]
id = "la"
schema_version = 1

