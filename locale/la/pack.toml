tabula = "tabula"
# tabulae (ledger, an insertion-ordered map) is one letter from tabula (map) on purpose:
# "two shades of the same thing" (Roman account books were tabulae). Not a typo;
# do not "fix" it (operator ruling 2026-10-10, need).
tabulae = "tabulae"
copia = "copia"
promissum = "promissum"
cursor = "cursor_t"
queue = "queue"
stack = "stack"
# Tensor family: identity rows (D6) so scaffold + completeness move together.
tensor = "tensor"
vector = "vector"
matrix = "matrix"
sparsa = "sparsa"
atomic = "atomic"
intervallum = "intervallum"
# Census relational-view type names (S2-U5): identity rows.
filtrum = "filtrum"
series = "series"
census = "census"
ratio = "ratio"
# Conversation family (DECISIONS D6.16). The meus/tuus rows also spell
# the sermo view methods `s.meus<T>()` / `s.tuus<T>()`.
sermo = "sermo"
scrinium = "scrinium"
trapped = "interceptum"
erratum = "erratum"
meus = "meus"
tuus = "tuus"

