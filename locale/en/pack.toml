modulus = "wrapping_ty"
saturatus = "saturating"
exactus = "trapping"
fractus = "float"
bivalens = "bool"
# Null type (D23.2); the null value literal is `null` in [keywords] above.
nihil = "none"
vacuum = "void"
numquam = "never"
ignotum = "unknown"
