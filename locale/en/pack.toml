regex = "regex"
json = "json"
valor = "value"
instans = "instant"
objectum = "object"
quidlibet = "any"
lista = "list"
# Shipped bounded forms: lista<T, magnitudo N>, lista<T, magnitudo lo‥hi>, textus<magnitudo N>, ascii<magnitudo N>.
tabula = "map"
# ledger: insertion-ordered map; la tabulae sits beside tabula on purpose.
tabulae = "ledger"
copia = "set"
promissum = "promise"
cursor = "iterator"
queue = "queue"
stack = "stack"
# Tensor family: tensor, vector, matrix and atomic keep their English spellings;
# sparsa -> sparse and intervallum -> range (ruling 2026-10-17). The pack owns the rows
# explicitly — no inherits = "la" substitute.
tensor = "tensor"
vector = "vector"
matrix = "matrix"
sparsa = "sparse"
atomic = "atomic"
intervallum = "range"
# Census relational-view type names (S2-U5): `filter` is the role-separated
# English surface for `filtrum` (design §7.3), distinct from the `filtrata`
# method surface by syntactic position.
filtrum = "filter"
series = "series"
census = "census"
ratio = "record"
# Conversation family (DECISIONS D6.16). The meus/tuus rows also spell
# the sermo view methods `s.meus<T>()` / `s.tuus<T>()`.
sermo = "channel"
scrinium = "frame"
trapped = "trapped"
erratum = "error"
meus = "send"
tuus = "recv"

[llm]
system_prompt_snippet = "Write Faber code using LLM-optimized English keywords (fn, let, const, if, else, match, return, etc.) with invariant structural glyphs (←, →, ∴). Type-first declarations: fn greet(string msg) → string { return msg } When a string contains a quote character (\" or '), write it with «…»: guillemets need no escapes."
exemplars = ["./exemplars/salve-munde.en.fab"]

# -----------------------------------------------------------------------------
# [intrinsics] — canonical intrinsic name → English surface spelling (L2)
#
# Maps every promoted intrinsic in intrinsics/registry.rs (INTRINSICS) to an
# en-locale surface spelling. One row per canonical faber_name; the row
# applies to every receiver family that owns the name (a row like
# `accipe = "get"` covers the Lista/Tabula/Textus/Sparsa/Tensor receivers).
# A missing row would mean canonical-only spelling (identity); the en pack is
# COMPLETE by construction — intrinsic_pack_completeness_test.rs iterates
# INTRINSICS and fails on any missing row.
#
# Naming scheme: mutating operations (return vacuum) take the plain English
# imperative (add, sort, reverse, append, shift_right); immutable
# value-returning counterparts take the participle/functional form (added,
# sorted, reversed, shifted_right). Identity rows (surface == canonical) are
# used where the canonical spelling is already English (matmul, gather, gelu,
# load, store, union, ...).
#
# Rows are grouped by receiver family for review; a shared canonical is
# listed once, in the first family that owns it, and called out in the later
# families' comments.
# -----------------------------------------------------------------------------

[intrinsics]
# atomic (4) — canonical spellings are already English; identity rows.
compare_exchange = "compare_exchange"
exchange = "exchange"
load = "load"
store = "store"

# lista (30)
accipe = "get"
# sermo directional view methods (SERMO_VIEW_METHODS): `accipe` / `cursor`
# are shared with the rows above and below; `fini` / `exhauri` live only here.
fini = "finish"
exhauri = "drain"
apud = "at"
addita = "added"
appende = "append"
# LSR-W0 argmax/argmin method twins — index or nihil on empty, never −1.
argmaxima = "argmax"
argminima = "argmin"
continet = "contains"
cumulata = "cumulate"
decapita = "remove_first"
extende = "extend"
filtrata = "filter"
# The sinking contract's method form (`immerge`); the `⇜` operator twin is its
# identity, and both append.
immerge = "sink"
# `inversa` serves two owners: Lista (immutable reverse) and Matrix
# (square-matrix inverse). "invert" reads naturally for both.
inversa = "invert"
inverte = "reverse"
longitudo = "length"
mappata = "map"
omissa = "drop"
omnia = "all"
ordina = "sort"
ordinata = "sorted"
prima = "take"
primus = "first"
quilibet = "any"
reducta = "reduce"
reperta = "find"
detrahe = "remove_last"
sectio = "slice"
summa = "sum"
ultima = "take_last"
ultimus = "last"
vacua = "is_empty"

# tabula (8) — accipe / longitudo / vacua are shared with lista above.
claves = "keys"
dele = "delete"
habet = "has"
pone = "put"
valores = "values"

# copia (12) — dele / habet / longitudo / vacua shared above.
adde = "add"
differentia = "difference"
intersectio = "intersection"
subcopia = "is_subset"
supercopia = "is_superset"
symmetrica = "difference_symmetric"
unio = "union"

# ascii (1) — method surface; do not retarget [types] cursor = "iterator".
cursor = "cursor"

# textus (12) — accipe / continet / longitudo / sectio / vacua shared above.
divide = "split"
finis = "ends_with"
initium = "starts_with"
maiuscula = "uppercase"
minuscula = "lowercase"
muta = "replace"
recide = "trim"

# numeric (numerus + fractus) (33) — addita / adde shared with lista / copia.
absolutum = "abs"
alterna = "flip"
alternata = "flipped"
complementa = "complement"
complementata = "complemented"
coniuncta = "bit_and"
coniunge = "bit_and_assign"
disiuncta = "bit_or"
disiunge = "bit_or_assign"
dextra = "shift_right"
dextrata = "shifted_right"
divida = "divide"
divisa = "divided"
maior = "greater"
maxime = "at_least"
maximus = "maximum"
minime = "at_most"
minimus = "minimum"
minor = "less"
modula = "modulo_assign"
modulata = "modulo"
multiplica = "multiply"
multiplicata = "multiplied"
nega = "negate"
negativa = "negated"
potentia = "power"
signum = "sign"
sinistra = "shift_left"
sinistrata = "shifted_left"
subtrahe = "subtract"
subtracta = "subtracted"

# fractus-only (5)
approximata = { canonical = "approx", aliases = ["approximata"] }
pavimentum = "floor"
rotunda = "round"
tectum = "ceiling"
trunca = "truncate"

# sparse (6) — accipe / longitudo shared with lista above.
densata = "densify"
magnitudines = "shape"
nonnihil = "count_nonzero"
ponde = "set"

# tensor (34) — longitudo / magnitudines / accipe / addita / subtracta /
# multiplicata / nega / summa / ponde / sectio shared with earlier families.
forma = "reshape"
addita_bias = "added_bias"
matmul = "matmul"
media = "mean"
reple = "fill"
crea = "create"
planata = "flatten"
gather = "gather"
rms_norm = "norm_rms"
rope_norm = "norm_rope"
rope_half = "rope_half"
softmax_causal = "softmax_causal"
gelu = "gelu"
silu = "silu"
# K5 (rule 15): the built-in scalar math functions lifted over a tensor.
# `absolutum` is shared with the numeric family above.
radix = "sqrt"
radix_cubica = "cbrt"
exponentia = "exp"
logarithmus = "ln"
logarithmus_decimalis = "log10"
sinus = "sin"
cosinus = "cos"
tangens = "tan"
activatio_relu = "relu"
crux_entropia = "cross_entropy"
activatio_softmax = "softmax"
transpone = "transpose"
# K6: an explicit zero-copy broadcast view; `expande` remains the Latin id.
expande = "expanded"
disloco = "shift"
limes = "edge"
laminatio = "norm_layer"
materialize = "materialize"
# `formata` is a static type-directed view; keep the canonical spelling until
# English owns a distinct surface name for it.
formata = "formata"

# matrix (7) — addita / subtracta / multiplicata / divisa / matmul / inversa
# shared with earlier families.
applica = "apply"

# vector (10) — addita / subtracta / multiplicata / divisa / longitudo / crea
# shared with earlier families.
productum = "dot"
transversum = "cross"
normalizata = "normalize"
# Q-X1: the tensor rank and the Euclidean norm (tensor and vector) are named methods; `longitudo` is the element count.
rank = "rank"
norm = "norm"
swizzle = "swizzle"

# range (5) — continet / longitudo shared with lista above.
coercere = "clamp"
inter = "intersect"
# Identity row even though `union` is also the en `discretio` keyword
# surface: keywords lex as identifiers and the parser claims them by latin
# identity in grammar slots, so a member call `interval.union(...)` parses.
union = "union"

# regex (3; divide and muta shared with textus above), match (5) and textus escape (munita)
consentit = "matches"
inventa = "find"
collecta = "find_all"
inventum = "text"
principium = "start"
terminus = "end"
coetus = "group"
nominatus = "named"
munita = "escape"

# -----------------------------------------------------------------------------
# [diagnostics.*] — materialized from la (S0-U3 flat-pack materialization).
# en's effective diagnostics previously came from `inherits = "la"`; the flat
# pack owns the canonical templates explicitly now. la stays byte-unchanged.
# -----------------------------------------------------------------------------
[diagnostics.LOCALE002]
message = "reader locale '{pack}' saw keyword-like spelling '{spelling}'"
help = "use '{suggestion}' if you meant that keyword; '{spelling}' is a valid name as written"

[diagnostics.LOCALE002.issues.source_reads_as_other_locale]
message = "source has no declared locale and its keywords read as '{detected}'"
help = "declare the locale with `+++ locale = \"{detected}\" +++` frontmatter or pass `--locale {detected}`; this note does not select the locale"

[diagnostics.LOCALE003]
message = "unknown or invalid reader locale '{locale_id}' in frontmatter"
help = "check the locale id is a valid reader locale directory name under the standard library reader path"

[diagnostics.LOCALE003.issues.invalid_id]
message = "frontmatter locale '{locale_id}' is not a valid locale identifier; locale ids must be simple directory names"
help = "Use a single directory name, not a path, for a locale pack under the configured reader-pack root."

[diagnostics.LOCALE003.issues.no_root]
message = "frontmatter declares locale '{locale_id}' but no language-pack root is configured"
help = "Configure the reader-pack root, then choose a locale directory beneath it."

[diagnostics.LOCALE003.issues.outside_root]
message = "frontmatter locale '{locale_id}' resolves outside the language-pack root"
help = "Check the locale directory and its symlinks; its pack must resolve inside the configured reader-pack root."

[diagnostics.LOCALE003.issues.load_failed]
message = "unknown reader locale '{locale_id}' in frontmatter: {detail}"
help = "Check that the locale directory contains a readable, valid `pack.toml`."

[diagnostics.LOCALE003.issues.not_a_string]
message = "frontmatter 'locale' key must be a string"
help = "Write `locale` as a quoted string, for example `locale = \"en\"`."

[diagnostics.LOCALE003.issues.unresolved]
message = "reader locale did not resolve for this source"
help = "check the locale id is a valid reader locale directory name under the standard library reader path"

[diagnostics.LOCALE004]
message = "identifier '{identifier}' mixes scripts: {scripts}"
help = "check for look-alike characters from another alphabet; the name is accepted as written"

[diagnostics.LEX001]
message = "unterminated string literal"
help = "close the string literal before the end of the line or file"

[diagnostics.LEX001.issues.unterminated_ascii_literal]
message = "unterminated ascii literal"
help = "Close the ASCII literal with `'` before the file ends."

[diagnostics.LEX001.issues.newline_in_ascii_literal]
message = "unterminated ascii literal (newline in literal)"
help = "ASCII literals are single-line; write `\\n` for a newline or close the literal before the line break."

[diagnostics.LEX001.issues.unterminated_backtick_template_literal]
message = "unterminated backtick template literal"
help = "Close the captured template with a backtick (`); it may span lines."

[diagnostics.LEX001.issues.unterminated_octeti_literal]
message = "unterminated {lista}<b8> literal"
help = "Close the byte literal with `|`; write its contents as pairs of hexadecimal digits."

[diagnostics.LEX001.issues.unterminated_regex_literal]
message = "unterminated regex literal"
help = "Close the raw pattern with `/` before the line ends; escape a slash inside it as `\\/`."

[diagnostics.LEX001.issues.empty_regex_literal]
message = "empty regex literal; write a pattern between the slashes"
help = "write a pattern between the slashes"

[diagnostics.LEX001.issues.unterminated_string_literal]
message = "unterminated string literal"
help = "Close the text string with `\"` before the line ends, or use `«...»` for multiline text."

[diagnostics.LEX001.issues.newline_in_string_literal]
message = "unterminated string literal (newline in string)"
help = "Double-quoted text strings are single-line; write `\\n` for a newline or use `«...»` for multiline text."

[diagnostics.LEX001.issues.unterminated_guillemet_block_string_literal]
message = "unterminated guillemet block string literal"
help = "Close the block string with `»`; it can span lines."

[diagnostics.LEX002]
message = "invalid number literal"
help = "check numeric separators and base prefixes"

[diagnostics.LEX002.issues.invalid_hexadecimal_number]
message = "invalid hexadecimal number"
help = "After `0x`, use hexadecimal digits (0–9, A–F in either case)."

[diagnostics.LEX002.issues.invalid_binary_number]
message = "invalid binary number"
help = "After `0b`, use only the binary digits 0 and 1."

[diagnostics.LEX002.issues.invalid_octal_number]
message = "invalid octal number"
help = "After `0o`, use only octal digits 0 through 7."

[diagnostics.LEX002.issues.invalid_floating_point_number]
message = "invalid floating-point number"
help = "Write a decimal number such as `1.5` or `1.5e-3`; an exponent needs digits."

[diagnostics.LEX002.issues.invalid_integer]
message = "invalid integer"
help = "Use decimal digits, optionally separated by `_`, or prefix a radix literal with `0x`, `0b`, or `0o`."

[diagnostics.LEX002.issues.float_overflow]
message = "float literal is too large; it overflows to infinity"
help = "Choose a finite value within the floating-point range; reduce the magnitude or make a positive exponent smaller."

[diagnostics.LEX002.issues.float_underflow]
message = "float literal is too small; it underflows to zero"
help = "Increase the nonzero value or make its exponent less negative so it stays within the floating-point range."

[diagnostics.LEX003]
message = "invalid escape sequence"
help = "use a supported escape sequence or escape the backslash"

[diagnostics.LEX003.issues.unknown_escape]
message = "unknown escape `\\{escape}`; a literal escapes only its own delimiter, backslash, n, t, r and u{{...}"
help = "remove the backslash, or write `\\\\` for a backslash"

[diagnostics.LEX004]
message = "unexpected character"
help = "remove the character or escape it if it should be literal"

[diagnostics.LEX004.issues.unexpected_character]
message = "unexpected character: {char}"
help = "If it is text, put it in a string literal; otherwise remove it or use the intended Faber spelling."

[diagnostics.LEX004.issues.homoglyph_did_you_mean]
message = "unexpected character: '{char}'; did you mean '{suggestion}'?"
help = "replace '{char}' with the canonical spelling '{suggestion}'"

[diagnostics.LEX006]
message = "invalid comment syntax"
help = "prefix comments with # instead of // or /* */"

[diagnostics.LEX006.issues.c_style_line_comment]
message = "C-style // comments are not valid in Faber; use # for line comments"
help = "Start the comment line with `#`; `//` is not a Faber line comment."

[diagnostics.LEX006.issues.c_style_block_comment]
message = "C-style /* */ block comments are not valid in Faber; use # for line comments"
help = "Faber has no block comments; put `#` at the start of each comment line."

[diagnostics.LEX006.issues.unterminated_c_style_block_comment]
message = "unterminated C-style block comment; Faber uses # for line comments"
help = "Faber has no block comments; rewrite the comment as lines beginning with `#`."

[diagnostics.LEX007]
message = "inline comments are not accepted"
help = "put the # comment on its own line above the code it documents"

[diagnostics.LEX007.issues.inline_hash_after_code]
message = "# comments must start a line; move this comment above the code"
help = "put the # comment on its own line above the code it documents"

[diagnostics.PARSE000]
message = "lexer error while parsing"
help = "fix the lexer error first; parsing continues from clean tokens"

[diagnostics.PARSE001]
message = "expected token"
help = "ensure the expected token is present in this position"

[diagnostics.PARSE001.issues.ratio_field_list_hole_not_sole]
message = "a `…` hole in a ratio field list must be the only element"
help = "Use `{ratio}<*>` to infer the whole field list; do not combine `*` with named fields."

[diagnostics.PARSE001.issues.ratio_type_arg_label_required]
message = "a ratio type argument must be labeled"
help = "Write each `{ratio}` type argument as `field: type`, for example `name: int`."

[diagnostics.PARSE001.issues.annotation_field_name]
message = "an annotation field must be an identifier"
help = "write a plain field name inside the annotation braces"

[diagnostics.PARSE001.issues.label_bind_distinction]
message = "label syntax uses `{label_operator}`, not the binding operator `{binding_operator}`"
help = "write `{label}{label_operator} value` for a labeled argument, or pass it by position"

[diagnostics.PARSE001.issues.labeled_actual_non_template_call]
message = "this call does not accept labeled arguments; labels belong to template calls"
help = "drop the label `{label}` and pass the value by position, or call a template literal"

[diagnostics.PARSE001.issues.labeled_actual_spread_unsupported]
message = "a spread argument cannot carry a label"
help = "remove the label from the spread argument"

[diagnostics.PARSE001.issues.copy_into_value_expected]
message = "a value is required after the copy-in operator `{operator}`"
help = "Write the source expression after `{operator}`."

[diagnostics.PARSE001.issues.sink_into_item_expected]
message = "an item is required after the sink-in operator `{operator}`"
help = "Write the item expression after `{operator}`."

[diagnostics.PARSE001.issues.duplicate_tuple_element_label]
message = "tuple element label `{label}` is used more than once"
help = "give each element a distinct label, or drop the labels"

[diagnostics.PARSE001.issues.implements_slot_requires_name]
message = "an implements slot must name a contract; `_` is not a conformance declaration"
help = "write the contract name in the implements clause"

[diagnostics.PARSE001.issues.import_field_name]
message = "an import field must be an identifier"
help = "use a supported field name: {ex}, {visibilitas}, {nomen}, {ut}, or {omnia}"

[diagnostics.PARSE001.issues.annotation_name]
message = "expected annotation name"
help = "add an annotation name after @"

[diagnostics.PARSE001.issues.secus_si_else_if]
message = "use '{sin}' for else-if"
help = "write `{sin}` with the condition directly after it; do not combine `{secus}` with `{si}`"

[diagnostics.PARSE001.issues.itera_mode]
message = "expected {expected}"
help = "choose `{ex}`, `{de}`, or `{ab}` before the iterable expression"

[diagnostics.PARSE001.issues.mutability_marker]
message = "expected {expected}"
help = "add let or mut before the binding name"

[diagnostics.PARSE001.issues.itera_de_requires_fixum]
message = "itera de bindings are always fixed; use {expected}"
