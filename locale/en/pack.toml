# Library-owned member fragment for the English reader surface.
# Not a reader keyword pack — only [pack] + [[library_members]].
# Canonical names stay the English source spellings in norma/src.
#
# Two identities for the same module:
#   provider = "norma"                      — radix check (`norma:text`)
#   provider = "package", package = "norma" — faber FileInterface
#
# The en pack defines `norma:text` as a total identity: every public member
# ships a row (identity rows keep the canonical spelling).

[pack]
id = "en"
schema_version = 1

[[library_members]]
provider = "norma"
module_path = ["text"]
kind = "function"
canonical = "reverse"
surface = "reverse"

