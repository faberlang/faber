[[redirects]]
term = "negativum"
canonical = "≡"
message = "Retired prefix predicate; use value < 0."

[[redirects]]
term = "positivum"
canonical = "≡"
message = "Retired prefix predicate; use value > 0."

[[redirects]]
term = "nonnihil"
canonical = "≢"
message = "Retired prefix predicate; use value ≢ nulla (D23.4)."

[[redirects]]
