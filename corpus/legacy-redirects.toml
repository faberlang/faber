# Legacy spellings without runnable exempla. Embedded in the `faber` binary
# for `faber explain`.

[[redirects]]
term = "ab pipeline"
canonical = "lista"
message = "Retired collection pipeline syntax; use ordinary collection methods and closures."

[[redirects]]
term = "=="
canonical = "≡"
message = "Legacy equality spelling; use ≡ in Faber source."

[[redirects]]
term = "!="
canonical = "≢"
message = "Legacy inequality spelling; use ≢ in Faber source."

[[redirects]]
term = "<="
canonical = "≤"
message = "Legacy less-than-or-equal spelling; use ≤ in Faber source."

[[redirects]]
term = ">="
canonical = "≥"
message = "Legacy greater-than-or-equal spelling; use ≥ in Faber source."

[[redirects]]
term = "->"
canonical = "→"
message = "Legacy return-arrow spelling; use → in Faber source."

[[redirects]]
term = "==="
canonical = "≡"
message = "Legacy equality spelling; use ≡ in Faber source."

[[redirects]]
term = "!=="
canonical = "≢"
