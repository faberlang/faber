# corpus/variant-cells.toml — claimable variant-cell ledger (hand-maintained).
#
# One row per claimable variant cell across the high-arity families
# (itera / summa / bounded-conversio / annotations / casts / closures /
# await-assignment / membership).
# Enumeration sourced from the 2026-08-25 variant-level corpus census
# (24b52ef3) and verified against live corpus state (413 .fab / 279 .expected
# at landing, 2026-08-26). The 441-cell conversio family×family matrix
# (examples/conversio-matrix/, measured fixtures) is intentionally NOT a
# claimable cell space — it collapses the boundedness axis and is not corpus
# teaching.
#
# Row fields:
#   id        stable cell identifier (unique, never reused)
#   family    itera | summa | bounded-conversio | annotations | casts | closures |
#             await-assignment | membership | tensor-views | tensor-runtime-size
#   cell      human-readable cell descriptor
#   status    direct       — a corpus exemplum teaches the cell (run/lane proven)
#             unit-proven  — proven only in semantic unit tests; zero corpus
#             bare         — no corpus exemplum anywhere (grammar admits, nothing teaches)
#   exemplum  corpus-relative .fab path (absent for bare/unit-proven cells)
#   expected  true when corpus/<exemplum>.expected exists (stdout pinned)
#   decline   true for reject/decline cells (diagnostic surface, not stdout admit)
#   required  true for NEW grammar surface: must ship exemplum + .expected or
#             stage 1 fails (never true on the existing backlog)
#   note      provenance / gap notes
#
# The stage-1 gate ./scripta/check-corpus-variant-cells enforces: direct rows
# name a real exemplum, .expected claims match disk, required rows cannot land
# bare, and the bare-cell ratchet below never grows.
#
# Ratchet: ratchet_baseline is the bare-cell count at mechanism landing. Catch-up
# batches convert bare -> direct and lower the baseline in the same commit; new
# surface landing bare raises the count and fails stage 1. Updated 2026-08-26
# (batch 2: 24 -> 18; batch 3: 18 -> 13; batch 4: 13 -> 0).

ratchet_baseline = 0

