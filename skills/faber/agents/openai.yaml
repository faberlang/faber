interface:
  display_name: "Faber"
  short_description: "Write, check, build, and review Faber (.fab) source; locale surfaces, grammar, corpus exempla, compiler validation recipes"
  default_prompt: "Use $faber for writing, checking, building, reviewing, or translating Faber source. Resolve the code locale first (CLI --locale, file frontmatter, faber.toml, pack) and use only that locale's spellings — default en; en and la surfaces are sealed against each other and must never be blended in one file. Runtime assignment is ← (= only sets compile-time-known values), declarations are type-first (T name), output is a line-level statement, nullability is T ∪ none (en) / T ∪ nihil (la). Verify legality with faber check (stdin: faber check -, import-free sources only, with a frontmatter locale because stdin reads Latin by default); default check output shows the message and help; faber check --no-diagnostics gives the compact code-first form (error[CODE:issue]: file:line with no prose), so read the message in the default output or with faber explain <CODE>[.<issue>] instead of guessing a fix from the bare code; follow references/grammar.md and grammar/EBNF.md for grammar, references/operators.md for operators, references/locales.md for pack mechanics, and corpus/ exempla for canonical style. For compiler internals or other changes to the Faber repo itself, use $faberlang instead."
