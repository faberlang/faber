interface:
  display_name: "Faberlang"
  short_description: "Build, test and change the Faber repository: compiler crates, faber CLI, Norma, locale packs, grammar sources, corpus and corpus suite"
  default_prompt: "Use $faberlang for work that changes this repository: the compiler crates under crates/ (lexer, parser, semantic, HIR, MIR, runner), the faber CLI and package workflow, Norma, locale packs, grammar sources, and the corpus and public corpus suite. Build with cargo build -p faber and verify with the in-repo binary, not an installed one, which goes stale. Prove a change with cargo test -p <crate> first, then faber corpus corpus-suites/public --target runner and --target roundtrip. Identify diagnostics by code, issue and args, never prose, and update the en and la locale packs together. Generated grammar files are never edited by hand. Follow references/source-map.md for navigation, references/compiler-work.md for parser, diagnostics and lowering work, and references/compiler-source-presentation.md for comments. Faber 1.x is experimental and has no compatibility promise. For writing or checking .fab source, use $faber instead."
